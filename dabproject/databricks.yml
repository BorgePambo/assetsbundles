# This is a Databricks asset bundle definition for dabproject.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: dabproject
  uuid: 6232a69b-f917-4504-8325-f6f1a1010807

include:
  - resources/*.yml
  - resources/**/*.yml


# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    mode: development
    default: true

    workspace:
      host: dbc-aab5aa5a-ee27.cloud.databricks.com

    presets:
      name_prefix: dev_${workspace.current_user.short_name}
      source_linked_deployment: false

    variables:
      catalog: assetbundles
      schema: ${workspace.current_user.short_name}


  prod:
    mode: production
    workspace:
      host: dbc-aab5aa5a-ee27.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/borge.pambo71@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/borge.pambo71@gmail.com/PROD/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: assetbundles
      schema: prod
    permissions:
      - user_name: borge.pambo71@gmail.com
        level: CAN_MANAGE




